name: APK derle

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Proje iskeletini oluştur
        run: flutter create --platforms=android --project-name video_birlestirici --org com.bono.videobirlestirici app

      - name: Kodları iskeletin içine kopyala
        run: |
          cp source/main.dart app/lib/main.dart
          cp source/pubspec.yaml app/pubspec.yaml
          mkdir -p app/assets
          rm -rf app/test

      - name: Konuşma modeli indir (müzik temizleme için)
        run: |
          curl -fL -o app/assets/model.rnnn https://raw.githubusercontent.com/GregorR/rnnoise-models/master/somnolent-hogwash-2018-09-01/sh.rnnn || rm -f app/assets/model.rnnn
          ls -la app/assets

      - name: Android ayarlarını yamala (izinler + minimum sürüm)
        run: |
          python3 - <<'PY'
          import glob
          for f in glob.glob('app/android/app/build.gradle*'):
              t = open(f).read()
              t = t.replace('flutter.minSdkVersion', '24')
              open(f, 'w').write(t)
          m = 'app/android/app/src/main/AndroidManifest.xml'
          t = open(m).read()
          perms = ('<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n'
                   '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n'
                   '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n'
                   '    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    ')
          t = t.replace('<application', perms + '<application', 1)
          t = t.replace('<application', '<application android:requestLegacyExternalStorage="true"', 1)
          open(m, 'w').write(t)
          PY

      - name: Tüm eklentileri Android 36 ile derle (file_picker hatası düzeltmesi)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/sdk36.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p.hasProperty('android')) {
                p.android.compileSdk = 36
              }
            }
          }
          EOF

      - name: Paketleri indir
        working-directory: app
        run: flutter pub get

      - name: APK derle
        working-directory: app
        run: flutter build apk --release --split-per-abi --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: video-birlestirici-apk
          path: app/build/app/outputs/flutter-apk/*.apk
